name: Update stats

on:
  schedule:
    - cron: "3-59/10 * * * *"   # every 10 min at :03, :13, ... (Pages allows ~10 deploys/hour)
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U "yt-dlp[curl-cffi]" requests
      - run: python scripts/update.py
      - name: Commit new numbers
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update stats"
            git pull --rebase -q
            git push
          fi
